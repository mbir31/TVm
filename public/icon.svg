<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#11141b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0d1017" />
  <!-- Remote Chassis Body -->
  <rect x="136" y="56" width="240" height="400" rx="64" fill="url(#chassis)" stroke="#4a5568" stroke-width="4" />
  <!-- Power button -->
  <circle cx="200" cy="120" r="22" fill="#991b1b" />
  <circle cx="200" cy="120" r="14" fill="none" stroke="#fca5a5" stroke-width="4" />
  <line x1="200" y1="106" x2="200" y2="120" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" />
  <!-- IR LED -->
  <circle cx="312" cy="120" r="16" fill="#10b981" />
  <!-- D-Pad Disc -->
  <circle cx="256" cy="240" r="68" fill="#171923" stroke="#4a5568" stroke-width="3" />
  <circle cx="256" cy="240" r="32" fill="url(#glow)" />
  <text x="256" y="246" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">OK</text>
  <!-- Navigation bars -->
  <rect x="176" y="340" width="48" height="28" rx="8" fill="#2d3748" />
  <rect x="236" y="340" width="40" height="28" rx="8" fill="#2563eb" />
  <rect x="288" y="340" width="48" height="28" rx="8" fill="#2d3748" />
  <!-- App buttons -->
  <rect x="176" y="388" width="76" height="24" rx="6" fill="#dc2626" />
  <rect x="260" y="388" width="76" height="24" rx="6" fill="#0284c7" />
</svg>
